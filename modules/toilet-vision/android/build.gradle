plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.toiletvision'
version = '0.1.0'

android {
  namespace "expo.modules.toiletvision"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // MediaPipe Tasks Vision: HandLandmarker + ObjectDetector, both on-device.
  implementation 'com.google.mediapipe:tasks-vision:1.0.0'
}
